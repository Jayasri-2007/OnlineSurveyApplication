
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submitted Surveys</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f0ff;
            padding: 25px;
        }

        h1 {
            text-align: center;
            color: #6a1b9a;
        }

        .survey {
            background: white;
            padding: 20px;
            margin: 20px auto;
            max-width: 700px;
            border-radius: 10px;
            box-shadow: 0 2px 8px #ccc;
        }

        .survey p {
            padding: 8px;
            border-bottom: 1px solid #eee;
        }

        a {
            display: block;
            text-align: center;
            margin: 20px;
            color: #6a1b9a;
        }
    </style>
</head>

<body>

    <h1>Submitted Surveys</h1>

    <div id="surveys">
        Loading surveys...
    </div>

    <a href="./">Back to Survey</a>

    <script>
        async function loadSurveys() {
            const container = document.getElementById("surveys");

            try {
                const response = await fetch(
                    "https://online-survey-api.onrender.com/api/feedback"
                );

                if (!response.ok) {
                    throw new Error("Unable to fetch surveys");
                }

                const data = await response.json();

                container.innerHTML = "";

                if (data.length === 0) {
                    container.textContent = "No submitted surveys available.";
                    return;
                }

                data.forEach((survey, index) => {
                    const card = document.createElement("div");
                    card.className = "survey";

                    const heading = document.createElement("h2");
                    heading.textContent = "Survey " + (index + 1);
                    card.appendChild(heading);

                    if (survey.submittedAt) {
                        const date = document.createElement("p");
                        date.textContent = "Submitted: " +
                            new Date(survey.submittedAt).toLocaleString();
                        card.appendChild(date);
                    }

                    (survey.responses || []).forEach((item, i) => {
                        const p = document.createElement("p");
                        p.textContent = (i + 1) + ". " +
                            item.question + " - " + item.answer;
                        card.appendChild(p);
                    });

                    container.appendChild(card);
                });

            } catch (error) {
                container.textContent =
                    "Unable to load surveys. Please try again later.";
                console.error(error);
            }
        }

        loadSurveys();
    </script>

</body>
</html>
